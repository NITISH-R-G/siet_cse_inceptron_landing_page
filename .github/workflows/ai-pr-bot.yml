name: AI PR Bot & Architecture Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz (for diagrams)
        run: sudo apt-get install -y graphviz

      # Run analysis on the PR branch
      - name: Run Repository Analyzer
        run: node scripts/repo-analyzer.js

      - name: Generate Architecture Diagrams
        run: node scripts/generate-diagrams.js

      - name: Update docs via AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ai-doc-agent.js

      # If the AI bot detected changes in docs or architecture, it can push them to the PR branch
      - name: Commit and push changes to PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(bot): auto-update documentation based on PR changes"
          file_pattern: "README.md docs/ .repo-metadata/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
