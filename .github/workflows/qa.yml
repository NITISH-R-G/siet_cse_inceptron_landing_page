name: Quality Assurance

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  merge_group:
  schedule:
    - cron: '0 0 * * 0' # Weekly audit

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

jobs:
  qa:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint Check
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload ESLint SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          category: eslint
        continue-on-error: true

      - name: Type Check
        run: npm run typecheck

      - name: Dead Code Check
        run: npm run deadcode > deadcode-report.txt || true

      - name: Duplicate Code Check
        run: npm run duplicates || true

      - name: Security Audit
        run: npm run security

      - name: Secret Detection
        run: npm run secrets

      - name: License Check
        run: npm run license-check > license-report.txt || true

      - name: Publish Workflow Summary
        if: always()
        run: |
          echo "## Quality Assurance Summary" >> $GITHUB_STEP_SUMMARY
          echo "Run completed." >> $GITHUB_STEP_SUMMARY

  ai-review:
    name: AI-Powered Insights
    runs-on: ubuntu-latest
    needs: qa
    if: github.event_name == 'pull_request'
    steps:
      - name: AI PR Reviewer
        uses: coderabbitai/ai-pr-reviewer@latest
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          system_message: |
            Explain findings in plain English.
            Prioritize issues by severity.
            Recommend fixes.
            Suggest refactoring opportunities.
            Highlight architectural concerns.
            Generate actionable maintenance tasks.
